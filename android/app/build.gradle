apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

// 说明：原计划的 com.janeasystems:nodejs-mobile-gradle 插件随 JCenter 关站已不可获取
// （Maven Central / Google Maven 均 404），因此改为手工放置预编译 libnode.so：
//   android/app/src/main/jniLibs/<abi>/libnode.so
// 由 tools/fetch-libnode.mjs 从 nodejs-mobile 的 npm 分发包中提取。

android {
    namespace 'com.ofm.client'
    compileSdk 34

    defaultConfig {
        applicationId 'com.ofm.client'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
        ndk {
            // nodejs-mobile 官方只提供 arm64-v8a / x86_64 等；真机基本是 arm64
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    buildFeatures {
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.14'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation platform('androidx.compose:compose-bom:2024.06.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'androidx.webkit:webkit:1.11.0'
}
