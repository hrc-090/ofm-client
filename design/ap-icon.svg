<svg width="512" height="512" viewBox="0 0 108 108" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="OFM 应用图标">
<title>OFM · 本机模型网关</title>
<defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#202C3A"/><stop offset="1" stop-color="#141D28"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.22" r="0.85">
      <stop offset="0" stop-color="#F6F4EF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#F6F4EF" stop-opacity="0"/>
    </radialGradient>
  </defs>
<rect x="0" y="0" width="108" height="108" rx="24" fill="url(#bg)"/>
<rect x="0" y="0" width="108" height="108" rx="24" fill="url(#glow)"/>
<!-- 主环周长 157.08：实线 135 + 缺口 22.08；旋转 -20° 使缺口中心落在右上 45° -->
  <g id="loop-ring">
    <circle cx="54" cy="54" r="25" fill="none" stroke="#F6F4EF" stroke-width="6.5"
            stroke-linecap="round" stroke-dasharray="135 22.08" transform="rotate(-20 54 54)"/>
  </g>
  <!-- 内侧刻度弧：仪器台语言，弱化处理 -->
  <g id="inner-tick" opacity="0.22">
    <circle cx="54" cy="54" r="15.5" fill="none" stroke="#F6F4EF" stroke-width="1.6"
            stroke-linecap="round" stroke-dasharray="25 72.39" transform="rotate(125 54 54)"/>
  </g>
  <!-- 活跃端口：朱砂点落在缺口中心，r=25 / -45° -->
  <g id="port"><circle cx="71.68" cy="36.32" r="6.0" fill="#E8835F"/></g>
</svg>